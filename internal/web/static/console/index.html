<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" type="image/png" href="/logo.png">
<title>Agnes Hub 控制台</title>
<style>
/* ==========================================================================
   Agnes Hub Console · 设计系统
   结构：设计令牌（双主题）→ 基础 → 布局外壳 → 组件 → 页面专有 → 移动端
   亮暗两套主题只通过 CSS 变量切换，组件层禁止硬编码颜色。
   ========================================================================== */

/* ---------- 1. 设计令牌 ---------- */
:root{
  /* 亮色 */
  --bg:#f5f6f8;              /* 应用底色 */
  --panel:#ffffff;           /* 卡片/面板 */
  --panel-2:#f8f9fb;         /* 次级面板（表头、代码底、内嵌块） */
  --line:#e5e8ee;            /* 主边框 */
  --line-soft:#eef0f4;       /* 弱分隔 */
  --ink:#18202b;             /* 主文字 */
  --ink-2:#46536b;           /* 次级文字 */
  --muted:#7b8698;           /* 弱文字 */
  --brand:#3b6ef5;
  --brand-ink:#ffffff;
  --brand-soft:#ecf1fe;
  --brand-line:#c3d3fb;
  --good:#0e8a63; --good-soft:#e4f5ee; --good-line:#b8e4d2;
  --warn:#a96a08; --warn-soft:#fbf1e0; --warn-line:#eed9b4;
  --bad:#cf3745;  --bad-soft:#fdebed;  --bad-line:#f3c2c8;
  --violet:#7048c8; --violet-soft:#f0eafc;
  --cyan:#0b7fa8; --cyan-soft:#e3f3fa;
  --shadow-sm:0 1px 2px rgba(16,24,40,.05);
  --shadow-md:0 4px 16px rgba(16,24,40,.08);
  --shadow-lg:0 12px 40px rgba(16,24,40,.16);
  --r-sm:8px; --r-md:10px; --r-lg:14px;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
  color-scheme: light;
}
html[data-theme="dark"]{
  --bg:#0d1117; --panel:#161c24; --panel-2:#1c242e;
  --line:#2a3441; --line-soft:#232c37;
  --ink:#e8eef5; --ink-2:#b3bfd0; --muted:#8a96a8;
  --brand:#5c8dff; --brand-ink:#0b1220; --brand-soft:#1a2a47; --brand-line:#2f4a7a;
  --good:#41d19a; --good-soft:#132e23; --good-line:#1f5a42;
  --warn:#e8b04b; --warn-soft:#33290f; --warn-line:#5e4a1c;
  --bad:#f2717d;  --bad-soft:#3a1c22;  --bad-line:#6b2c35;
  --violet:#a487ec; --violet-soft:#241d3d;
  --cyan:#4fbde0; --cyan-soft:#12303d;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow-md:0 4px 16px rgba(0,0,0,.45);
  --shadow-lg:0 12px 40px rgba(0,0,0,.6);
  color-scheme: dark;
}
@media (prefers-color-scheme: dark){
  html[data-theme="auto"]{
    --bg:#0d1117; --panel:#161c24; --panel-2:#1c242e;
    --line:#2a3441; --line-soft:#232c37;
    --ink:#e8eef5; --ink-2:#b3bfd0; --muted:#8a96a8;
    --brand:#5c8dff; --brand-ink:#0b1220; --brand-soft:#1a2a47; --brand-line:#2f4a7a;
    --good:#41d19a; --good-soft:#132e23; --good-line:#1f5a42;
    --warn:#e8b04b; --warn-soft:#33290f; --warn-line:#5e4a1c;
    --bad:#f2717d;  --bad-soft:#3a1c22;  --bad-line:#6b2c35;
    --violet:#a487ec; --violet-soft:#241d3d;
    --cyan:#4fbde0; --cyan-soft:#12303d;
    --shadow-sm:0 1px 2px rgba(0,0,0,.4);
    --shadow-md:0 4px 16px rgba(0,0,0,.45);
    --shadow-lg:0 12px 40px rgba(0,0,0,.6);
    color-scheme: dark;
  }
}

/* ---------- 2. 基础 ---------- */
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
a{color:var(--brand);text-decoration:none}
a:hover{text-decoration:underline}
h1,h2,h3,h4{margin:0;font-weight:650;color:var(--ink)}
h2{font-size:15px;letter-spacing:.01em}
h3{font-size:13px;color:var(--ink-2);font-weight:600}
code,pre,.mono{font-family:var(--mono)}
::placeholder{color:var(--muted);opacity:.8}
:focus-visible{outline:2px solid var(--brand);outline-offset:1px;border-radius:4px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--muted);background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}

/* ---------- 3. 布局外壳（参考 new-api/gpt-load：固定侧栏 + 顶部条 + 内容区） ---------- */
.shell{display:flex;min-height:100vh}
.sidebar{width:228px;flex:0 0 228px;background:var(--panel);border-right:1px solid var(--line);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;padding:16px 14px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px;border-bottom:1px solid var(--line-soft);margin-bottom:12px}
.brand img{width:30px;height:30px;border-radius:8px}
.brand b{font-size:15px;letter-spacing:.01em;display:block;line-height:1.2}
.brand .sub{font-size:11px;color:var(--muted);line-height:1.4;margin-top:2px}
.nav{display:flex;flex-direction:column;gap:2px;flex:1}
.nav-label{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.06em;padding:10px 10px 6px;text-transform:uppercase}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r-md);
  color:var(--ink-2);font-size:13.5px;font-weight:500;text-decoration:none;transition:background .12s,color .12s}
.nav a .ico{width:18px;text-align:center;font-size:15px;flex:0 0 18px}
.nav a:hover{background:var(--panel-2);color:var(--ink);text-decoration:none}
.nav a.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
.side-foot{border-top:1px solid var(--line-soft);padding-top:10px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.main{flex:1;min-width:0;padding:0}
.topbar{height:52px;display:flex;align-items:center;gap:10px;padding:0 24px;
  background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.topbar .crumb{font-size:14px;font-weight:600}
.topbar .subline{font-size:12px;color:var(--muted);margin-left:4px}
.topbar .grow{flex:1}
.topbar .pill{flex:0 0 auto}
.content{padding:20px 24px 48px;max-width:1200px}

/* ---------- 4. 组件 ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:18px;margin-bottom:16px;box-shadow:var(--shadow-sm)}
.card>.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.card>.card-head .desc{font-size:12px;color:var(--muted)}
h2 .tag{font-size:11px;font-weight:500;color:var(--muted);margin-left:6px}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.sec{margin-top:16px;padding-top:14px;border-top:1px dashed var(--line)}
.sec>h3{margin-bottom:10px}

/* KPI 卡（参考 gpt-load：图标 + 语义色 + 值 + 标签） */
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-md);padding:14px 16px;
  display:flex;gap:12px;align-items:flex-start;box-shadow:var(--shadow-sm)}
.kpi .ico{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;
  font-size:16px;flex:0 0 34px;background:var(--brand-soft)}
.kpi.good .ico{background:var(--good-soft)} .kpi.warn .ico{background:var(--warn-soft)}
.kpi.bad .ico{background:var(--bad-soft)}   .kpi.violet .ico{background:var(--violet-soft)}
.kpi.cyan .ico{background:var(--cyan-soft)}
.kpi .k{font-size:12px;color:var(--muted);margin-bottom:2px}
.kpi .v{font-size:22px;font-weight:700;font-family:var(--mono);line-height:1.15;letter-spacing:-.01em}
.kpi .v small{font-size:12px;font-weight:500;color:var(--muted);margin-left:2px}
.kpi .note{font-size:11px;color:var(--muted);margin-top:2px}

/* 按钮 */
button{font:inherit;font-weight:500;padding:7px 14px;border-radius:var(--r-md);border:1px solid var(--line);
  background:var(--panel);color:var(--ink);cursor:pointer;transition:background .12s,border-color .12s,filter .12s;white-space:nowrap}
button:hover{background:var(--panel-2);border-color:var(--muted)}
button:active{filter:brightness(.96)}
button.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
button.primary:hover{background:var(--brand);filter:brightness(1.08);border-color:var(--brand)}
button.danger{color:var(--bad);border-color:var(--bad-line)}
button.danger:hover{background:var(--bad-soft);border-color:var(--bad)}
button.sm{padding:4px 10px;font-size:12px;border-radius:var(--r-sm)}
button:disabled{opacity:.55;cursor:not-allowed}
.icon-btn{padding:6px 8px;font-size:14px;line-height:1}

/* 表单 */
input,select,textarea{font:inherit;padding:7px 11px;border:1px solid var(--line);border-radius:var(--r-md);
  background:var(--panel);color:var(--ink);width:100%;transition:border-color .12s,box-shadow .12s}
input:hover,select:hover,textarea:hover{border-color:var(--muted)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
textarea{font-family:var(--mono);font-size:12px;min-height:90px;resize:vertical;line-height:1.5}
label{font-size:12px;color:var(--ink-2);font-weight:500;display:block;margin-bottom:5px}
.hint{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.5}
fieldset{border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px;margin:0}
legend{font-size:12px;color:var(--muted);padding:0 6px;font-weight:600}
.check-row{display:flex;gap:9px;align-items:flex-start;cursor:pointer;padding:6px 0}
.check-row input[type=checkbox]{width:15px;height:15px;flex:0 0 15px;margin:2px 0 0;accent-color:var(--brand)}
.check-row .t{font-size:13.5px;color:var(--ink);font-weight:500}

/* 表格 */
.tbl-wrap{border:1px solid var(--line);border-radius:var(--r-md);overflow:auto;background:var(--panel)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line-soft);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600;background:var(--panel-2);white-space:nowrap;position:sticky;top:0}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--panel-2)}
td .cell-sub{font-size:11px;color:var(--muted);margin-top:2px;line-height:1.45}
td .cell-sub .mono{font-size:11px}
.empty{padding:36px 16px;text-align:center;color:var(--muted);font-size:13px}
.empty .ico{font-size:26px;display:block;margin-bottom:8px;opacity:.6}

/* 徽章与状态 */
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:500;
  background:var(--panel-2);color:var(--ink-2);border:1px solid var(--line);white-space:nowrap;line-height:1.6}
.pill.ok{background:var(--good-soft);color:var(--good);border-color:var(--good-line)}
.pill.off{background:var(--bad-soft);color:var(--bad);border-color:var(--bad-line)}
.pill.info{background:var(--brand-soft);color:var(--brand);border-color:var(--brand-line)}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:var(--warn-line)}
.pill.violet{background:var(--violet-soft);color:var(--violet);border-color:transparent}
.pill.cyan{background:var(--cyan-soft);color:var(--cyan);border-color:transparent}
.dot{width:6px;height:6px;border-radius:50%;display:inline-block;background:currentColor}

/* 提示条 */
.banner{padding:10px 14px;border-radius:var(--r-md);font-size:13px;margin-bottom:12px;border:1px solid transparent;display:flex;gap:8px;align-items:flex-start}
.banner.warn{background:var(--warn-soft);color:var(--warn);border-color:var(--warn-line)}
.banner.good{background:var(--good-soft);color:var(--good);border-color:var(--good-line)}
.banner.bad{background:var(--bad-soft);color:var(--bad);border-color:var(--bad-line)}
.banner.info{background:var(--brand-soft);color:var(--brand);border-color:var(--brand-line)}
.hide{display:none!important}

/* 进度条 */
.bar{height:6px;border-radius:999px;background:var(--line-soft);overflow:hidden;min-width:70px}
.bar>i{display:block;height:100%;background:var(--brand);border-radius:999px;transition:width .3s}

/* 页头工具条 */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.muted{color:var(--muted)} .ink2{color:var(--ink-2)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* 登录页（居中卡片 + 品牌） */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
  background:
    radial-gradient(900px 480px at 85% -10%, var(--brand-soft), transparent 60%),
    radial-gradient(700px 420px at -10% 110%, var(--violet-soft), transparent 55%),
    var(--bg)}
.login{width:100%;max-width:400px}
.login .card{padding:28px;border-radius:16px;box-shadow:var(--shadow-md)}
.login .brand-big{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.login .brand-big img{width:40px;height:40px;border-radius:10px}
.login h1{font-size:18px}
.login .tagline{color:var(--muted);font-size:13px;margin:0 0 18px}
.login input{height:38px}
.login .hint{margin-top:14px;text-align:center}

/* 弹窗 */
.modal-back{position:fixed;inset:0;background:rgba(9,13,20,.5);backdrop-filter:blur(2px);
  display:flex;align-items:flex-start;justify-content:center;z-index:50;padding:40px 16px;overflow:auto}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px 22px;
  max-width:780px;width:100%;box-shadow:var(--shadow-lg);margin-bottom:40px}
.modal .grid{grid-template-columns:1fr 1fr}
.modal h2{margin-bottom:4px}
.modal .modal-sub{font-size:12px;color:var(--muted);margin-bottom:14px}
.reqbox{max-width:760px}
.reqbox pre{margin:0;background:var(--panel-2);color:var(--ink);border:1px solid var(--line);
  border-radius:var(--r-md);padding:12px;max-height:52vh;overflow:auto;
  font:12.5px/1.6 var(--mono);white-space:pre-wrap;word-break:break-word}
.reqbox .kv{display:flex;gap:10px;margin:3px 0;font-size:12.5px}
.reqbox .kv .kk{color:var(--muted);flex:0 0 92px}
.reqbox .hmeta{background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r-md);
  padding:10px 14px;margin-top:10px}

/* 运行实况（live） */
.live-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.live-head .live-dot{width:8px;height:8px;border-radius:50%;background:var(--good);
  box-shadow:0 0 0 3px color-mix(in srgb, var(--good) 20%, transparent);animation:livepulse 2s ease-in-out infinite}
@keyframes livepulse{0%,100%{box-shadow:0 0 0 3px color-mix(in srgb, var(--good) 22%, transparent)}
  50%{box-shadow:0 0 0 6px color-mix(in srgb, var(--good) 6%, transparent)}}
.live-head .busy-pill{font-size:12px;padding:3px 11px;border-radius:999px;border:1px solid var(--line);
  background:var(--panel-2);color:var(--muted);white-space:nowrap;font-weight:500}
.live-head .busy-pill.busy-on{background:var(--brand-soft);color:var(--brand);border-color:var(--brand-line);font-weight:600}
.live-head .busy-pill.busy-warn{background:var(--warn-soft);color:var(--warn);border-color:var(--warn-line);font-weight:600}
.win-pills{display:flex;gap:4px;background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:3px}
.win-pills .win-pill{padding:3px 12px;border-radius:999px;border:none;background:transparent;
  color:var(--muted);font-size:12px;font-weight:600;cursor:pointer}
.win-pills .win-pill:hover{color:var(--ink)}
.win-pills .win-pill.on{background:var(--panel);color:var(--brand);box-shadow:var(--shadow-sm)}
.live-card{background:var(--panel-2);border:1px solid var(--line-soft);border-radius:var(--r-md);
  padding:14px 16px;margin:12px 0}
.live-card h3{margin:0 0 2px;font-size:13.5px;color:var(--ink)}
.live-card h3 .muted{font-weight:400;font-size:12px}
.live-card .sub2{color:var(--muted);font-size:12px;margin-bottom:8px;line-height:1.5}
.live-canvas{width:100%;height:150px;display:block}
.live-readout{display:flex;flex-wrap:wrap;gap:10px 18px;margin-top:8px}
.live-readout .ro{display:flex;align-items:baseline;gap:6px}
.live-readout b{font-size:17px;font-weight:700;font-family:var(--mono)}
.live-readout .ro span{font-size:11px;color:var(--muted)}
.live-legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.live-legend .lg{display:inline-flex;align-items:center;gap:5px;font-size:12px;
  background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:2px 9px;color:var(--ink-2)}
.live-legend .lg i{width:9px;height:9px;border-radius:2px;display:inline-block}

/* 到达密度迷你直方图 */
.mini-hist{display:flex;gap:2px;align-items:flex-end;height:30px;margin-bottom:4px}
.mini-hist .mh{flex:1;display:flex;align-items:flex-end;height:100%}
.mini-hist .mh i{display:block;width:100%;border-radius:1px}

/* ---------- 5. 移动端 ---------- */
@media (max-width:820px){
  .shell{flex-direction:column}
  .sidebar{width:auto;flex:none;height:auto;position:static;border-right:none;border-bottom:1px solid var(--line);padding:12px 14px}
  .nav{flex-direction:row;flex-wrap:wrap;gap:4px}
  .nav-label{display:none}
  .nav a{padding:6px 10px}
  .nav a.on{background:var(--brand);color:var(--brand-ink)}
  .side-foot{border-top:none;padding-top:6px;margin-left:auto}
  .brand{padding-bottom:10px;margin-bottom:8px}
  .topbar{padding:0 14px}
  .topbar .subline{display:none}
  .content{padding:14px 14px 40px}
  .g4{grid-template-columns:repeat(2,1fr)}
  .g2,.g3{grid-template-columns:1fr}
  .kpi .v{font-size:19px}
  .card{padding:14px;margin-bottom:12px}
  table{font-size:13px}
  th,td{padding:8px 9px}
}
</style>
</head>
<body>
<script>
/* 主题引导：首帧前执行，避免暗色用户闪白屏。三态 auto/light/dark 持久化 localStorage。 */
(function(){
  const saved = localStorage.getItem("agnes_theme") || "auto";
  document.documentElement.setAttribute("data-theme", saved);
})();
</script>
<div id="app"></div>
<div id="modalRoot"></div>
<script type="module" src="/console/app.js"></script>
</body>
</html>
