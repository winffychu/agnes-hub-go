<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" type="image/png" href="/logo.png">
<title>Agnes Hub</title>
<style>
/* ==========================================================================
   Agnes Hub Console · 设计系统 v4（对标 sub2api）
   主色 Teal（#14b8a6 系）+ slate 灰阶；卡片 rounded-2xl + 阴影层级；
   KPI 彩底图标块；徽章胶囊形；按钮渐变主色 + active 缩放微交互。
   令牌双主题；组件层零硬编码颜色。图标一律 icons.js 内联 SVG。
   ========================================================================== */
:root{
  --bg:#f8fafc; --panel:#ffffff; --panel-2:#f1f5f9;
  --line:#e2e8f0; --line-soft:#e8edf3;
  --ink:#0f172a; --ink-2:#334155; --muted:#64748b;
  --brand:#0d9488; --brand-ink:#ffffff;      /* 主按钮 = teal-600 */
  --accent:#0d9488; --accent-soft:#f0fdfa;   /* teal-600 / teal-50 */
  --good:#059669; --good-soft:#ecfdf5;
  --warn:#d97706; --warn-soft:#fffbeb;
  --bad:#dc2626;  --bad-soft:#fef2f2;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
  --r:8px; --r-lg:14px;
  --shadow-card:0 1px 3px rgba(0,0,0,.04),0 1px 2px rgba(0,0,0,.06);
  --shadow-card-h:0 10px 40px rgba(0,0,0,.08);
  --shadow-btn:0 4px 14px rgba(13,148,136,.25);
  --mesh:radial-gradient(at 40% 20%,rgba(20,184,166,.10) 0,transparent 50%),
         radial-gradient(at 80% 0%,rgba(6,182,212,.08) 0,transparent 50%),
         radial-gradient(at 0% 50%,rgba(20,184,166,.08) 0,transparent 50%);
  color-scheme: light;
}
html[data-theme="dark"]{
  --bg:#020617; --panel:#0f172a; --panel-2:#1e293b;
  --line:#1e293b; --line-soft:#172033;
  --ink:#f1f5f9; --ink-2:#cbd5e1; --muted:#94a3b8;
  --brand:#14b8a6; --brand-ink:#02201f;
  --accent:#2dd4bf; --accent-soft:rgba(45,212,191,.12);
  --good:#34d399; --good-soft:rgba(16,185,129,.15);
  --warn:#fbbf24; --warn-soft:rgba(245,158,11,.15);
  --bad:#f87171;  --bad-soft:rgba(239,68,68,.15);
  --shadow-card:0 1px 3px rgba(0,0,0,.4),0 1px 2px rgba(0,0,0,.3);
  --shadow-card-h:0 10px 40px rgba(0,0,0,.5);
  --shadow-btn:0 4px 14px rgba(20,184,166,.2);
  --mesh:radial-gradient(at 40% 20%,rgba(20,184,166,.14) 0,transparent 50%),
         radial-gradient(at 80% 0%,rgba(6,182,212,.09) 0,transparent 50%),
         radial-gradient(at 0% 50%,rgba(20,184,166,.10) 0,transparent 50%);
  color-scheme: dark;
}
@media (prefers-color-scheme: dark){
  html[data-theme="auto"]{
    --bg:#020617; --panel:#0f172a; --panel-2:#1e293b;
    --line:#1e293b; --line-soft:#172033;
    --ink:#f1f5f9; --ink-2:#cbd5e1; --muted:#94a3b8;
    --brand:#14b8a6; --brand-ink:#02201f;
    --accent:#2dd4bf; --accent-soft:rgba(45,212,191,.12);
    --good:#34d399; --good-soft:rgba(16,185,129,.15);
    --warn:#fbbf24; --warn-soft:rgba(245,158,11,.15);
    --bad:#f87171;  --bad-soft:rgba(239,68,68,.15);
    --shadow-card:0 1px 3px rgba(0,0,0,.4),0 1px 2px rgba(0,0,0,.3);
    --shadow-card-h:0 10px 40px rgba(0,0,0,.5);
    --shadow-btn:0 4px 14px rgba(20,184,166,.2);
    --mesh:radial-gradient(at 40% 20%,rgba(20,184,166,.14) 0,transparent 50%),
           radial-gradient(at 80% 0%,rgba(6,182,212,.09) 0,transparent 50%),
           radial-gradient(at 0% 50%,rgba(20,184,166,.10) 0,transparent 50%);
    color-scheme: dark;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:13.5px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
/* mesh 渐变背景层（sub2api AppLayout bg-mesh-gradient 对标） */
body::before{content:"";position:fixed;inset:0;z-index:-1;background:var(--mesh);pointer-events:none}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
h1,h2,h3{margin:0;font-weight:600;color:var(--ink)}
h2{font-size:14px}
code,pre,.mono{font-family:var(--mono)}
::placeholder{color:var(--muted);opacity:.7}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px}
::-webkit-scrollbar-track{background:transparent}
svg.i{flex:0 0 auto;vertical-align:-2px}

/* 外壳 */
.shell{display:flex;min-height:100vh}
.sidebar{width:220px;flex:0 0 220px;background:var(--panel);border-right:1px solid var(--line);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;padding:14px 12px}
.brand{display:flex;align-items:center;gap:9px;padding:2px 8px 14px}
.brand img{width:24px;height:24px;border-radius:6px}
.brand b{font-size:13.5px;font-weight:650}
.brand .sub{font-size:11px;color:var(--muted);margin-top:1px;font-family:var(--mono)}
.nav{display:flex;flex-direction:column;gap:1px;flex:1}
.nav a{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:10px;
  color:var(--muted);font-size:13px;font-weight:500;text-decoration:none;transition:background .15s,color .15s}
.nav a:hover{background:var(--panel-2);color:var(--ink);text-decoration:none}
.nav a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav-sec{margin-bottom:10px}
.nav-sec:last-child{margin-bottom:0}
.nav .sec-title{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);
  padding:0 10px 4px;font-weight:600;opacity:.75}
.side-foot{border-top:1px solid var(--line-soft);padding-top:8px;display:flex;gap:2px}
.side-foot button{border:none;background:transparent;color:var(--muted);padding:6px 8px;border-radius:var(--r)}
.side-foot button:hover{background:var(--panel-2);color:var(--ink)}
.side-foot button.danger:hover{color:var(--bad);background:var(--bad-soft)}
.main{flex:1;min-width:0}
.topbar{height:46px;display:flex;align-items:center;gap:10px;padding:0 20px;
  background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.topbar .crumb{font-size:13.5px;font-weight:600}
.topbar .grow{flex:1}
.content{padding:20px;max-width:1200px}
/* 顶部加载进度条 */
.loadbar{position:fixed;top:0;left:0;height:2px;width:0;background:var(--accent);z-index:99;
  transition:width .18s ease,opacity .3s;opacity:0}
.loadbar.on{opacity:1;width:70%}
.loadbar.done{width:100%;opacity:0}

/* 卡片：rounded-2xl + 阴影层级 + hover 抬升（sub2api .card/.card-hover 对标） */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);margin-bottom:16px;
  box-shadow:var(--shadow-card);transition:box-shadow .3s,transform .3s,border-color .3s}
.card.card-hover:hover{transform:translateY(-2px);box-shadow:var(--shadow-card-h);border-color:var(--muted)}
.card>.card-head{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line-soft)}
.card>.card-head h2{font-size:13.5px}
.card>.card-head .count{font-family:var(--mono);font-size:12px;color:var(--muted);font-weight:400}
.card>.card-head .desc{font-size:12px;color:var(--muted)}
.card>.card-head .grow{flex:1}
.card>.body{padding:16px}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(330px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.sec{margin-top:14px;padding-top:14px;border-top:1px solid var(--line-soft)}
.sec>h3{font-size:12px;color:var(--muted);font-weight:600;margin-bottom:10px;letter-spacing:.02em}

/* KPI：stat-card（彩底图标块 + label + 大数字 + 副指标，sub2api stat-card 对标）。
   旧 .kpi 类保留兼容（about.js 沿用），overview 用 .kpi2 = .card 外壳 + .stat-card 内层 */
.kpi{padding:12px 14px}
.kpi .k{font-size:12px;color:var(--muted);margin-bottom:3px}
.kpi .v{font-size:20px;font-weight:650;font-family:var(--mono);letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:11px;font-weight:400;color:var(--muted);margin-left:2px}
.kpi .note{font-size:11px;color:var(--muted);margin-top:2px}
.kpi.tgood .v{color:var(--good)} .kpi.twarn .v{color:var(--warn)} .kpi.tbad .v{color:var(--bad)}
.kpi2 .stat-card{display:flex;align-items:center;gap:12px;padding:14px 16px}
.stat-icon{flex:0 0 44px;height:44px;width:44px;border-radius:12px;display:flex;align-items:center;justify-content:center}
.stat-icon svg{width:21px;height:21px}
.stat-icon.primary{background:var(--accent-soft);color:var(--accent)}
.stat-icon.good{background:var(--good-soft);color:var(--good)}
.stat-icon.warn{background:var(--warn-soft);color:var(--warn)}
.stat-icon.bad{background:var(--bad-soft);color:var(--bad)}
.kpi2 .k{font-size:12px;color:var(--muted);margin-bottom:2px}
.kpi2 .v{font-size:20px;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums;font-family:var(--mono)}
.kpi2 .v small{font-size:11px;font-weight:400;color:var(--muted);margin-left:2px}
.kpi2 .note{font-size:11px;color:var(--muted);margin-top:2px}
.kpi2.tgood .v{color:var(--good)} .kpi2.twarn .v{color:var(--warn)} .kpi2.tbad .v{color:var(--bad)}

/* 按钮：渐变主色 + 彩色阴影 + active 缩放（sub2api .btn-primary 对标） */
button{font:inherit;font-weight:500;font-size:13px;padding:6px 12px;border-radius:var(--r);border:1px solid var(--line);
  background:var(--panel);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:6px;
  transition:background .15s,border-color .15s,box-shadow .2s,transform .1s;white-space:nowrap}
button:hover{background:var(--panel-2)}
button:active:not(:disabled){transform:scale(.98)}
button.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink);box-shadow:var(--shadow-btn)}
button.primary:hover{background:var(--brand);opacity:.92;box-shadow:0 6px 18px rgba(13,148,136,.32)}
button.accent{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:var(--shadow-btn)}
button.accent:hover{opacity:.88;background:var(--accent)}
button.danger{color:var(--bad)}
button.danger:hover{background:var(--bad-soft);border-color:var(--bad)}
button.sm{padding:4px 9px;font-size:12px;border-radius:7px}
button.ghost{border-color:transparent;background:transparent;color:var(--muted)}
button.ghost:hover{background:var(--panel-2);color:var(--ink)}
button:disabled{opacity:.5;cursor:not-allowed;transform:none}
button:focus-visible{outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 30%,transparent)}
.icon-btn{padding:6px;border-radius:var(--r)}

/* 表单：focus ring 3px accent（sub2api .input 对标） */
input,select,textarea{font:inherit;font-size:13px;padding:6px 10px;border:1px solid var(--line);border-radius:var(--r);
  background:var(--panel);color:var(--ink);width:100%;transition:border-color .15s,box-shadow .15s}
input:hover,select:hover,textarea:hover{border-color:var(--muted)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
textarea{font-family:var(--mono);font-size:12px;min-height:90px;resize:vertical;line-height:1.5}
label{font-size:12px;color:var(--ink-2);font-weight:500;display:block;margin-bottom:4px}
.hint{font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.5}
.check-row{display:flex;gap:8px;align-items:flex-start;cursor:pointer;padding:5px 0}
.check-row input[type=checkbox]{width:14px;height:14px;flex:0 0 14px;margin:2px 0 0;accent-color:var(--accent)}
.check-row .t{font-size:13px;color:var(--ink);font-weight:500}

/* 表格：表头 uppercase 小标签风 + sticky（sub2api DataTable thead 对标） */
.tbl-wrap{overflow:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
th{font-size:10.5px;color:var(--muted);font-weight:600;background:color-mix(in srgb,var(--panel-2) 85%,transparent);
  backdrop-filter:blur(8px);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap;position:sticky;top:0}
tbody tr:last-child td{border-bottom:none}
tbody tr{transition:background .15s}
tbody tr:hover td{background:var(--panel-2)}
td .cell-sub{font-size:11px;color:var(--muted);margin-top:1px;line-height:1.4}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.empty{padding:32px 16px;text-align:center;color:var(--muted);font-size:12.5px}

/* 徽章：胶囊形（rounded-full，sub2api .badge 对标） */
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:999px;font-size:11px;font-weight:500;
  background:var(--panel-2);color:var(--ink-2);white-space:nowrap;border:1px solid transparent}
.badge.ok{background:var(--good-soft);color:var(--good)}
.badge.off{background:var(--bad-soft);color:var(--bad)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.info{background:var(--accent-soft);color:var(--accent)}

/* 提示条 */
.banner{padding:8px 12px;border-radius:var(--r);font-size:12.5px;margin-bottom:12px;border:1px solid transparent;display:flex;gap:8px;align-items:flex-start}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
.banner.good{background:var(--good-soft);color:var(--good)}
.banner.bad{background:var(--bad-soft);color:var(--bad)}
.hide{display:none!important}
.bar{height:4px;border-radius:999px;background:var(--line-soft);overflow:hidden;min-width:60px}
.bar>i{display:block;height:100%;background:var(--accent);transition:width .3s}
.row{display:flex;gap:10px;flex-wrap:wrap}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.muted{color:var(--muted)} .ink2{color:var(--ink-2)}

/* 登录：纯净居中卡，无渐变 */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.login{width:100%;max-width:360px}
.login .card{padding:24px}
.login h1{font-size:16px;margin-bottom:2px}
.login .tagline{color:var(--muted);font-size:12.5px;margin:0 0 16px}
.login input{height:36px}
.login .foot{margin-top:14px;font-size:11.5px;color:var(--muted)}

/* 弹窗 */
.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-start;
  justify-content:center;z-index:50;padding:48px 16px;overflow:auto}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px;
  max-width:640px;width:100%;box-shadow:0 16px 48px rgba(0,0,0,.25);margin-bottom:40px}
.modal.wide{max-width:720px}
.modal h2{margin-bottom:2px;font-size:14px}
.modal .modal-sub{font-size:12px;color:var(--muted);margin-bottom:14px}
.modal .grid{grid-template-columns:1fr 1fr}
.reqbox{max-width:760px}
.reqbox pre{margin:0;background:var(--panel-2);color:var(--ink);border:1px solid var(--line);
  border-radius:var(--r);padding:12px;max-height:52vh;overflow:auto;
  font:12px/1.6 var(--mono);white-space:pre-wrap;word-break:break-word}
.reqbox .kv{display:flex;gap:10px;margin:3px 0;font-size:12px}
.reqbox .kv .kk{color:var(--muted);flex:0 0 90px}
.reqbox .hmeta{background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;margin-top:10px}

/* 实况 */
.live-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.live-head h2{display:flex;align-items:center;gap:7px}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--good);animation:livepulse 2s ease-in-out infinite}
@keyframes livepulse{0%,100%{opacity:1}50%{opacity:.35}}
.busy-pill{font-size:11.5px;padding:2px 9px;border-radius:999px;border:1px solid var(--line);
  background:var(--panel-2);color:var(--muted);white-space:nowrap}
.busy-pill.busy-on{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.busy-pill.busy-warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.seg{display:flex;gap:2px;background:var(--panel-2);border-radius:var(--r);padding:2px}
.seg .win-pill{padding:3px 10px;border-radius:6px;border:none;background:transparent;
  color:var(--muted);font-size:11.5px;font-weight:500}
.seg .win-pill:hover{color:var(--ink)}
.seg .win-pill.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.live-block{padding:12px 0;border-top:1px solid var(--line-soft)}
.live-block:first-of-type{border-top:none;padding-top:4px}
.live-block h3{font-size:12.5px;margin-bottom:2px}
.live-block h3 .muted{font-weight:400;font-size:11.5px;margin-left:6px}
.live-block .sub2{color:var(--muted);font-size:11.5px;margin-bottom:8px}
.live-canvas{width:100%;height:140px;display:block}
.live-readout{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:6px}
.live-readout .ro{display:flex;align-items:baseline;gap:5px;font-size:11.5px;color:var(--muted)}
.live-readout b{font-size:14px;font-weight:650;font-family:var(--mono)}
.live-legend{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.live-legend .lg{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--ink-2)}
.live-legend .lg i{width:8px;height:8px;border-radius:2px;display:inline-block}
.mini-hist{display:flex;gap:2px;align-items:flex-end;height:28px;margin-bottom:4px}
.mini-hist .mh{flex:1;display:flex;align-items:flex-end;height:100%}
.mini-hist .mh i{display:block;width:100%;border-radius:1px}

/* 移动端 */
@media (max-width:820px){
  .shell{flex-direction:column}
  .sidebar{width:auto;flex:none;height:auto;position:static;border-right:none;border-bottom:1px solid var(--line);padding:10px 12px}
  .nav{flex-direction:row;flex-wrap:wrap;gap:3px}
  .nav a{padding:5px 9px}
  .side-foot{border-top:none;padding-top:4px;margin-left:auto}
  .content{padding:14px}
  .topbar{padding:0 14px}
  .g4{grid-template-columns:repeat(2,1fr)}
  .g2,.g3{grid-template-columns:1fr}
  .modal .grid{grid-template-columns:1fr}
  th,td{padding:7px 8px}
  .tabs-shell{top:46px}
}

/* 陈旧版本提示条：横贯 topbar 下方，warn 软底 */
.verbar{display:flex;align-items:center;gap:10px;padding:8px 20px;background:var(--warn-soft);
  color:var(--warn);font-size:12.5px;border-bottom:1px solid var(--line-soft)}
.verbar button{padding:3px 10px;font-size:12px}

/* 设置页分组（节流区拆语义组）与保存条 */
.fieldset{border:none;margin:0;padding:0}
.fieldset legend{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.02em;padding:0;margin-bottom:10px}
.dirty-state{font-size:11.5px;color:var(--warn);align-self:center}
.savebar{display:flex;justify-content:flex-end;align-items:center;gap:10px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line-soft)}
.dirty-hint{font-size:11.5px;color:var(--muted)}

/* 表单错误行内提示（复用 hint 定位） */
.field-err{font-size:11.5px;color:var(--bad);margin-top:4px}

/* 确认弹窗（替代原生 confirm） */
.confirm-box{max-width:420px}
.confirm-box .modal-sub{margin-bottom:10px}
.confirm-box ul{margin:8px 0;padding-left:18px;font-size:12.5px;color:var(--ink-2);line-height:1.7}

/* 设置页 sticky tab 导航（sub2api settings-tabs-shell 对标）：毛玻璃 + 圆角 + 阴影 */
.tabs-shell{position:sticky;top:54px;z-index:20;display:flex;gap:4px;padding:6px;border-radius:var(--r-lg);
  margin-bottom:16px;background:color-mix(in srgb,var(--panel) 92%,transparent);backdrop-filter:blur(16px);
  border:1px solid var(--line);box-shadow:var(--shadow-card);overflow-x:auto;scrollbar-width:none}
.tabs-shell::-webkit-scrollbar{display:none}
.tabs-shell button{height:36px;border:none;box-shadow:none;background:transparent;border-radius:10px;
  padding:0 14px;color:var(--muted);font-size:12.5px;font-weight:500;flex:0 0 auto}
.tabs-shell button:hover{background:var(--panel-2);color:var(--ink)}
.tabs-shell button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.tabs-shell button svg{flex:0 0 auto}

/* 账号池批量浮条（sub2api AccountBulkActionsBar 对标）：teal 软底条 */
.bulk-bar{display:flex;align-items:center;gap:10px;background:var(--accent-soft);border-radius:10px;
  padding:10px 12px;margin-bottom:12px;font-size:12.5px;color:var(--accent);font-weight:500}
.bulk-bar .grow{flex:1}

/* @supports 回退：不支持 backdrop-filter 时毛玻璃改不透明 */
@supports not (backdrop-filter:blur(1px)){
  .tabs-shell{background:var(--panel)}
  th{background:var(--panel-2)}
}
</style>
</head>
<body>
<script>
(function(){
  const saved = localStorage.getItem("agnes_theme") || "auto";
  document.documentElement.setAttribute("data-theme", saved);
})();
</script>
<!-- 控制台构建版本（go:embed 无法做内容 hash，用版本号做陈旧模块检测的锚点） -->
<script>window.__CONSOLE_BUILD__ = "{{.Version}}";</script>
<div id="app"></div>
<div id="modalRoot"></div>
<script type="module" src="/console/app.js"></script>
</body>
</html>
