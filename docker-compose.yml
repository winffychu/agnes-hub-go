# agnes-hub-go — Docker Compose
#
#   docker compose up -d          启动
#   docker compose logs -f        看日志
#   docker compose down           停止（数据保留在 ./data）
#
# 首次启动后打开 http://<主机IP>:4142/console 设置管理员密码，
# 再到「账号池」里添加 Agnes 账号。

services:
  agnes-hub:
    image: ghcr.io/winffychu/agnes-hub-go:latest
    # 本地构建改用下面两行（注释掉 image）：
    # build: .
    container_name: agnes-hub
    restart: unless-stopped
    ports:
      - "4142:4142"
    volumes:
      # 运行期数据全 JSON 文件：账号池 / 密钥 / 用量日志 / 聊天记录
      - ./data:/data
    environment:
      # 容器内自更新无意义（重启回滚镜像版本），显式关闭
      AGNES_HUB_UPDATE_REPO: "off"
      TZ: "Asia/Shanghai"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4142/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    # 只读根文件系统 + /data 单独可写：进一步收紧容器权限
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
